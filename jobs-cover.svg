<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none" role="img" aria-label="AuraEd Careers Banner - Engineering and Design Open Hub">
  <defs>
    <linearGradient id="jobsSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ed"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="jobsLift" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0071e3" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Banner Canvas -->
  <rect width="1200" height="360" rx="20" fill="url(#jobsSky)"/>

  <!-- Architectural Glass Ribbons -->
  <circle cx="1080" cy="80" r="180" fill="#38bdf8" opacity="0.25"/>
  <circle cx="120" cy="300" r="160" fill="#818cf8" opacity="0.2"/>

  <!-- Interactive Career Pods -->
  <!-- Pod 1: Platform & SRE -->
  <g transform="translate(100, 60)" filter="url(#jobsLift)">
    <rect x="0" y="0" width="310" height="230" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="8" rx="4" fill="#0071e3"/>
    <circle cx="40" cy="45" r="18" fill="#e0f2fe"/>
    <circle cx="40" cy="45" r="9" fill="#0071e3"/>
    <text x="75" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Cloud &amp; Platform</text>
    <text x="75" y="58" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Golang &bull; K8s &bull; Distributed Systems</text>
    <line x1="25" y1="85" x2="285" y2="85" stroke="#f1f5f9" stroke-width="1.5"/>
    <!-- Metric row -->
    <rect x="25" y="105" width="260" height="42" rx="8" fill="#f8fafc"/>
    <text x="40" y="130" font-family="-apple-system, sans-serif" font-size="12" fill="#334155">Average Platform SLA: <strong>99.99%</strong></text>
    <rect x="25" y="160" width="260" height="42" rx="8" fill="#f8fafc"/>
    <text x="40" y="185" font-family="-apple-system, sans-serif" font-size="12" fill="#334155">Real-time Telemetry: <strong>&lt; 10ms</strong></text>
  </g>

  <!-- Pod 2: Experience & Inclusive Design -->
  <g transform="translate(445, 60)" filter="url(#jobsLift)">
    <rect x="0" y="0" width="310" height="230" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="8" rx="4" fill="#818cf8"/>
    <circle cx="40" cy="45" r="18" fill="#ede9fe"/>
    <circle cx="40" cy="45" r="9" fill="#6366f1"/>
    <text x="75" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Inclusive Design</text>
    <text x="75" y="58" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Figma &bull; WCAG 2.1 AA &bull; User Research</text>
    <line x1="25" y1="85" x2="285" y2="85" stroke="#f1f5f9" stroke-width="1.5"/>
    <rect x="25" y="105" width="260" height="42" rx="8" fill="#f8fafc"/>
    <text x="40" y="130" font-family="-apple-system, sans-serif" font-size="12" fill="#334155">Zero Digital Barriers Goal</text>
    <rect x="25" y="160" width="260" height="42" rx="8" fill="#f8fafc"/>
    <text x="40" y="185" font-family="-apple-system, sans-serif" font-size="12" fill="#334155">Assistive Tech Usability Lab</text>
  </g>

  <!-- Pod 3: Culture & Learning Growth -->
  <g transform="translate(790, 60)" filter="url(#jobsLift)">
    <rect x="0" y="0" width="310" height="230" rx="16" fill="url(#blueCard)"/>
    <circle cx="40" cy="45" r="18" fill="#ffffff" opacity="0.2"/>
    <circle cx="40" cy="45" r="8" fill="#ffffff"/>
    <text x="75" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Why Join AuraEd?</text>
    <text x="75" y="58" font-family="-apple-system, sans-serif" font-size="11" fill="#bae6fd">Melbourne HQ &bull; National Hybrid</text>
    <line x1="25" y1="85" x2="285" y2="85" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <text x="25" y="125" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff">&bull; $3,500 Annual Learning Grant</text>
    <text x="25" y="155" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff">&bull; Apple Hardware Ecosystem</text>
    <text x="25" y="185" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff">&bull; Flexible 2/3 Hybrid Workflow</text>
  </g>
</svg>
