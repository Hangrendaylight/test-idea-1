<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" fill="none" role="img" aria-label="AuraEd Technologies Innovation Campus and Engineering Laboratory">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="appleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ed"/>
      <stop offset="100%" stop-color="#005bb5"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="hubShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0071e3" flood-opacity="0.12"/>
    </filter>
    <filter id="cardFloat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Sky & Campus Horizon Canvas -->
  <rect width="1200" height="520" rx="24" fill="url(#skyGrad)"/>

  <!-- Architectural Background Grid & Ambient Beams -->
  <circle cx="950" cy="80" r="240" fill="#bae6fd" opacity="0.35"/>
  <circle cx="200" cy="420" r="280" fill="#e0e7ff" opacity="0.3"/>
  <path d="M0 380 Q300 340 600 370 T1200 350 L1200 520 L0 520 Z" fill="#f8fafc"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Main Central Innovation Pavilion / Glass Hub -->
  <g filter="url(#hubShadow)">
    <rect x="180" y="70" width="840" height="340" rx="20" fill="url(#glassWall)" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Ribbon header on glass hub -->
    <rect x="180" y="70" width="840" height="48" rx="20" fill="#0071e3" opacity="0.06"/>
    <circle cx="210" cy="94" r="6" fill="#0071e3"/>
    <circle cx="230" cy="94" r="6" fill="#38bdf8"/>
    <circle cx="250" cy="94" r="6" fill="#94a3b8"/>
    <text x="600" y="100" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#0071e3" text-anchor="middle" letter-spacing="1.5">AURAED TECHNOLOGY PRECINCT &bull; INNOVATION LAB</text>
  </g>

  <!-- Collaborative Digital Interface Mockup (Floating Center Display) -->
  <g filter="url(#cardFloat)">
    <rect x="360" y="145" width="480" height="230" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- App UI Header -->
    <rect x="360" y="145" width="480" height="36" rx="14" fill="#f8fafc"/>
    <rect x="380" y="158" width="60" height="10" rx="5" fill="#0071e3"/>
    <rect x="450" y="158" width="40" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="500" y="158" width="40" height="10" rx="5" fill="#cbd5e1"/>
    
    <!-- Code / Data Analytics Visualization Streams -->
    <rect x="380" y="200" width="180" height="75" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="395" y="222" font-family="monospace" font-size="11" fill="#166534" font-weight="bold">Platform Latency: 4ms</text>
    <polyline points="395,260 430,240 460,250 490,230 520,245 540,235" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="580" y="200" width="240" height="75" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="595" y="222" font-family="-apple-system, sans-serif" font-size="11" fill="#1e40af" font-weight="600">WCAG 2.1 AA Compliance: 100%</text>
    <rect x="595" y="235" width="210" height="10" rx="5" fill="#dbeafe"/>
    <rect x="595" y="235" width="210" height="10" rx="5" fill="url(#appleBlue)"/>
    <text x="595" y="262" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Zero Accessibility Barriers Detected</text>

    <!-- Bottom Metric Chips -->
    <rect x="380" y="295" width="130" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="395" y="320" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">2.4M+</text>
    <text x="395" y="340" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Active Students</text>

    <rect x="525" y="295" width="135" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="540" y="320" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#0071e3">99.99%</text>
    <text x="540" y="340" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Uptime Reliability</text>

    <rect x="675" y="295" width="145" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="690" y="320" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#6366f1">100%</text>
    <text x="690" y="340" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Semantic Standards</text>
  </g>

  <!-- Left Collaborative Station (Engineers at Modern Desk) -->
  <g transform="translate(140, 220)" filter="url(#cardFloat)">
    <rect x="0" y="0" width="180" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="50" cy="40" r="20" fill="#0071e3"/>
    <rect x="35" y="66" width="30" height="40" rx="6" fill="#0071e3"/>
    <rect x="75" y="30" width="85" height="8" rx="4" fill="#0f172a"/>
    <rect x="75" y="45" width="60" height="6" rx="3" fill="#64748b"/>
    <!-- Laptop screen -->
    <rect x="80" y="70" width="75" height="45" rx="4" fill="#0f172a"/>
    <rect x="84" y="74" width="67" height="37" rx="2" fill="#1e293b"/>
    <line x1="88" y1="82" x2="115" y2="82" stroke="#38bdf8" stroke-width="2"/>
    <line x1="88" y1="90" x2="135" y2="90" stroke="#34d399" stroke-width="2"/>
    <line x1="88" y1="98" x2="120" y2="98" stroke="#f472b6" stroke-width="2"/>
    <text x="90" y="135" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#0071e3" text-anchor="middle">Distributed Core</text>
  </g>

  <!-- Right Collaborative Station (UX & Accessibility Research Pod) -->
  <g transform="translate(880, 220)" filter="url(#cardFloat)">
    <rect x="0" y="0" width="180" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="130" cy="40" r="20" fill="#818cf8"/>
    <rect x="115" y="66" width="30" height="40" rx="6" fill="#818cf8"/>
    <rect x="20" y="30" width="85" height="8" rx="4" fill="#0f172a"/>
    <rect x="20" y="45" width="55" height="6" rx="3" fill="#64748b"/>
    <!-- Tablet & Color Tokens -->
    <rect x="20" y="68" width="80" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="36" cy="85" r="7" fill="#0071e3"/>
    <circle cx="56" cy="85" r="7" fill="#38bdf8"/>
    <circle cx="76" cy="85" r="7" fill="#818cf8"/>
    <circle cx="36" cy="103" r="7" fill="#22c55e"/>
    <circle cx="56" cy="103" r="7" fill="#f59e0b"/>
    <text x="90" y="135" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#6366f1" text-anchor="middle">Accessible Design</text>
  </g>

  <!-- Floating Apple Blue Pill Badge at bottom -->
  <g transform="translate(480, 435)" filter="url(#cardFloat)">
    <rect x="0" y="0" width="240" height="38" rx="19" fill="#0071e3"/>
    <circle cx="20" cy="19" r="5" fill="#ffffff"/>
    <text x="130" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CAMPUS RECRUITMENT ACTIVE</text>
  </g>
</svg>
